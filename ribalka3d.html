<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Рыбалка с Бибинто 3D</title>
<style>
:root{--bg:#0e0b14;--panel:#1a1524;--panel2:#231c31;--text:#f1eaff;--muted:#a89bbf;--accent:#ff3d7f;--line:#2f2643;--gold:#fbbf24}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#view{position:fixed;inset:0;touch-action:none;cursor:crosshair}
#view canvas{display:block;width:100%;height:100%}
.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 16px;pointer-events:none;flex-wrap:wrap}
.top>*{pointer-events:auto}
h1{font-size:18px;margin:0;text-shadow:0 2px 6px #000}
h1 small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.hud{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center;background:rgba(10,6,18,.68);padding:6px 10px;border-radius:10px;backdrop-filter:blur(4px);max-width:860px;justify-content:flex-end}
.hud b{color:var(--text)}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:14px;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1a1200;font-weight:700}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.boss{background:#7f1d1d;border-color:#ef4444;font-weight:700}
#bars{position:fixed;top:84px;left:50%;transform:translateX(-50%);display:flex;gap:16px;pointer-events:none}
.bar{width:180px;display:none}
.bar.on{display:block}
.bar label,.bhp label{font-size:12px;font-weight:700;text-shadow:0 1px 3px #000}
.tr{height:14px;background:rgba(0,0,0,.6);border-radius:7px;overflow:hidden;margin-top:3px;border:1px solid rgba(255,255,255,.15)}
.tr i{display:block;height:100%;width:0;background:#4ade80;border-radius:7px;transition:width .15s}
#cross{position:fixed;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;border:2px solid rgba(255,255,255,.7);border-radius:50%;pointer-events:none;display:none}
#big{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:64px;font-weight:900;color:#ffe14d;text-shadow:0 0 12px #000,0 4px 0 #000;pointer-events:none;display:none}
#dmg{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);font-size:44px;font-weight:900;text-shadow:0 0 12px #000,0 3px 0 #000;pointer-events:none;opacity:0;transition:opacity .25s,top .6s;text-align:center;white-space:pre-line}
#warn{position:fixed;left:50%;top:134px;transform:translateX(-50%);color:#ef4444;font-weight:800;text-shadow:0 1px 4px #000;pointer-events:none;display:none}
#toast{position:fixed;left:50%;top:164px;transform:translateX(-50%);background:rgba(0,0,0,.8);padding:9px 16px;border-radius:10px;font-weight:700;pointer-events:none;opacity:0;transition:opacity .3s;max-width:90vw;text-align:center;z-index:12}
#feed{position:fixed;left:16px;bottom:60px;display:flex;flex-direction:column;gap:4px;pointer-events:none;max-width:min(360px,80vw)}
#feed div{background:rgba(10,6,18,.75);padding:5px 10px;border-radius:8px;font-size:12px;animation:pop .3s}
#hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(10,6,18,.68);padding:7px 14px;border-radius:10px;font-size:14px;color:#ddd;pointer-events:none;text-align:center;max-width:92vw}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);font-size:18px;z-index:20;text-align:center;padding:16px}
#bossUI{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(560px,94vw);background:rgba(20,6,10,.85);border:2px solid #ef4444;border-radius:16px;padding:12px 14px;display:none;z-index:5;box-shadow:0 0 40px -8px #ef4444}
#bossUI .bhp{margin-bottom:8px}
#iBoss{background:#ef4444}#iMe{background:#38bdf8}
.timing{position:relative;height:26px;background:#2a1010;border-radius:13px;margin:10px 0;overflow:hidden;border:1px solid #ef4444}
.timing .z1{position:absolute;left:32%;width:36%;top:0;bottom:0;background:rgba(251,191,36,.35)}
.timing .z2{position:absolute;left:44%;width:12%;top:0;bottom:0;background:rgba(74,222,128,.7)}
.timing #mark{position:absolute;top:-2px;bottom:-2px;width:6px;margin-left:-3px;background:#fff;border-radius:3px;box-shadow:0 0 8px #fff}
.ov{position:fixed;inset:0;background:rgba(5,3,10,.78);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.ov.show{display:flex}
.card{--rc:#9aa0a6;background:var(--panel);border:2px solid var(--rc);border-radius:18px;max-width:680px;width:100%;max-height:92vh;overflow:auto;padding:16px;box-shadow:0 0 40px -6px var(--rc);animation:pop .35s ease}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.ctop{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pf{width:170px;height:210px;border-radius:12px;flex:none;overflow:hidden;background:radial-gradient(circle at 50% 40%,var(--rc),#120d1a 75%);display:flex;align-items:center;justify-content:center;font-size:100px}
.pf canvas{width:100%!important;height:100%!important}
.cinfo{flex:1;min-width:180px}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#111;text-transform:uppercase;letter-spacing:.06em}
.cinfo h2{margin:8px 0 2px;font-size:24px}
.nick{color:var(--muted);font-size:14px}
.money{margin-top:10px;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.money.neg{color:#f87171}.money.pos{color:#4ade80}
.money small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px;margin-top:14px}
.row{background:var(--panel2);border-radius:9px;padding:7px 10px;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.row span:first-child{color:var(--muted);white-space:nowrap}
.row span:last-child{text-align:right;font-weight:600}
h3{margin:16px 0 6px;font-size:15px}
.outfit{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.outfit li{background:var(--panel2);border-radius:9px;padding:7px 10px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.outfit .slot{color:var(--muted);width:78px;flex:none}
.outfit .nm{flex:1;min-width:140px}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap}
.t-fake{background:#7f1d1d;color:#fecaca}.t-mass{background:#374151;color:#e5e7eb}.t-vintage{background:#5b3a1e;color:#fde2c4}.t-brand{background:#1e3a8a;color:#bfdbfe}.t-lux{background:#fbbf24;color:#1a1200}
.price{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.total{margin-top:8px;font-size:14px;text-align:right}
.desc{margin:14px 0 0;padding:10px 12px;border-left:3px solid var(--rc);background:var(--panel2);border-radius:0 9px 9px 0;font-size:14px;line-height:1.45;font-style:italic}
.rob{margin-top:12px;padding:12px;border-radius:12px;background:#3b0a14;border:1px solid #ef4444;font-size:15px;line-height:1.5}
.rob b{color:#fca5a5;font-size:20px}
.win{margin-top:12px;padding:12px;border-radius:12px;background:#0b3b1e;border:1px solid #4ade80;font-size:15px;line-height:1.5}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.clist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.citem{display:flex;align-items:center;gap:8px;background:var(--panel2);border-radius:10px;padding:8px 10px;border-left:4px solid var(--c);flex-wrap:wrap}
.citem .n{flex:1;font-size:14px;cursor:pointer;min-width:150px}
.citem .n small{display:block;color:var(--muted);font-size:12px}
.empty{color:var(--muted);text-align:center;padding:24px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tabs .btn.on{background:var(--accent);border-color:var(--accent)}
.shop{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.sitem{background:var(--panel2);border-radius:12px;padding:10px 12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid transparent}
.sitem.eq{border-color:var(--accent)}
.sitem.lock{opacity:.55}
.sitem .ic{font-size:30px;width:40px;text-align:center}
.sitem .tx{flex:1;min-width:200px}
.sitem .tx b{font-size:15px}
.sitem .tx p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.sitem .tx .st{font-size:12px;color:#c4b5fd;margin-top:3px}
.sitem .pr{font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
table.lb{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
table.lb th,table.lb td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line)}
table.lb th{color:var(--muted);font-weight:600}
table.lb td.r{text-align:right;font-variant-numeric:tabular-nums}
input.txt{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 10px;font-size:14px;font-family:inherit;min-width:0}
.t-leg{background:#f97316;color:#1a0a00}.t-myth{background:linear-gradient(90deg,#ff3d7f,#c084fc,#38bdf8);color:#fff}
#duelUI{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(600px,94vw);background:rgba(6,12,24,.88);border:2px solid #38bdf8;border-radius:16px;padding:12px 14px;display:none;z-index:5;box-shadow:0 0 40px -8px #38bdf8}
#armyUI{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(660px,94vw);background:rgba(18,10,4,.9);border:2px solid #f59e0b;border-radius:16px;padding:12px 14px;display:none;z-index:5;box-shadow:0 0 40px -8px #f59e0b}
#armyUI .ord{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:6px}
#armyUI .ord .btn.on,.chk.on{outline:2px solid #fbbf24;background:#3a2a08}
#tourUI{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:rgba(10,6,24,.88);border:2px solid #a78bfa;border-radius:14px;padding:8px 14px;display:none;z-index:6;font-size:14px;min-width:260px;text-align:center;box-shadow:0 0 30px -8px #a78bfa}
#tourUI .big{font-size:26px;font-weight:900;color:#fde047}
#tourUI table{width:100%;font-size:13px;margin-top:4px}#tourUI td{padding:1px 6px}
.chk{cursor:pointer;user-select:none}
.ctag{display:inline-block;padding:0 6px;border-radius:6px;font-weight:800;font-size:12px;color:#000;margin-right:4px}
.timing .mk{position:absolute;top:-2px;bottom:-2px;width:6px;margin-left:-3px;background:#fff;border-radius:3px;box-shadow:0 0 8px #fff}
.pows{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.btn.pw.on{background:#7c3aed;border-color:#c084fc;box-shadow:0 0 12px #c084fc}
.dq{background:var(--panel2);border-radius:12px;padding:12px;margin-top:10px}
.dq .opts{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.dq .opts .btn{text-align:left}
.dcal{display:flex;gap:6px;overflow-x:auto;padding:6px 0 10px}
.dday{flex:none;width:74px;background:var(--panel2);border-radius:10px;padding:6px 4px;text-align:center;font-size:12px;border:2px solid transparent}
.dday .ic{font-size:24px;display:block}.dday.done{opacity:.5}.dday.today{border-color:var(--gold);box-shadow:0 0 14px -4px var(--gold)}.dday.ms{background:linear-gradient(160deg,#3b1d5e,#1a1524);border-color:#c084fc}
.exb{display:inline-block;font-size:10px;font-weight:800;padding:1px 6px;border-radius:6px;background:linear-gradient(90deg,#ff3d7f,#c084fc);color:#fff;margin-left:4px;vertical-align:middle}
#auth{z-index:40}#auth .card{max-width:440px}
#auth .f{display:flex;flex-direction:column;gap:8px;margin-top:12px}#auth .err{color:#fca5a5;font-size:13px;min-height:18px}
.tcols{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:620px){.tcols{grid-template-columns:1fr}}
.tcols .clist{max-height:38vh;overflow:auto}
.chatw{display:grid;grid-template-columns:200px 1fr;gap:10px;margin-top:10px;height:min(62vh,560px)}
@media(max-width:620px){.chatw{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:70vh}.chl{max-height:120px}}
.chl{display:flex;flex-direction:column;gap:4px;overflow:auto;background:var(--panel2);border-radius:10px;padding:6px}
.chl .btn{text-align:left;display:flex;justify-content:space-between;gap:6px;align-items:center}.chl .btn.on{background:var(--accent);border-color:var(--accent)}
.chl .ub{background:#ef4444;color:#fff;border-radius:999px;font-size:11px;padding:0 6px;font-weight:800}
.chm{display:flex;flex-direction:column;min-height:0;background:var(--panel2);border-radius:10px}
.chh{padding:8px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:700}
.msgs{flex:1;overflow:auto;padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-height:0}
.msg{max-width:85%;background:var(--panel);border-radius:10px;padding:6px 9px;font-size:14px;line-height:1.35;word-wrap:break-word;align-self:flex-start}
.msg.me{align-self:flex-end;background:#3b1430}.msg.sys{align-self:center;background:none;color:var(--muted);font-size:12px;font-style:italic}
.msg .au{font-weight:700;cursor:pointer;font-size:12px}.msg .au:hover{text-decoration:underline}.msg .tm{color:var(--muted);font-size:11px;margin-left:6px}
.msg .x{cursor:pointer;color:#f87171;font-size:11px;margin-left:6px}
.chf{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}.chf input{flex:1}
.cbadge{background:#ef4444;color:#fff;border-radius:999px;font-size:11px;padding:0 6px;margin-left:4px;font-weight:800}
#drop{position:fixed;inset:0;border:4px dashed var(--accent);background:rgba(255,61,127,.12);display:none;align-items:center;justify-content:center;font-size:24px;font-weight:800;z-index:30;pointer-events:none}
</style>
</head>
<body>
<div id="view"></div>
<div class="top">
  <h1>🎣 Рыбалка на грязнулек с Бибинто<small id="locName">Китай-город</small></h1>
  <div class="hud">
    <span>💰 <b id="hWal" style="color:var(--gold)">0 ₽</b></span>
    <span title="Доход тусовки">🏠 <b id="hInc">0</b>/мин</span>
    <span>Поймано: <b id="hCount">0</b></span>
    <span>Наживка: <b id="hBait">—</b></span>
    <span title="Рейтинг дуэлей">🏅 <b id="hElo">1000</b></span>
    <span title="Кубки турниров">🏆 <b id="hCups">0</b></span>
    <span id="hDem" title="Спрос на альтушек: падает, когда много продаёшь, и восстанавливается со временем" style="display:none">📉 <b id="hDemV">100%</b></span>
    <button class="btn sm gold" id="bDaily">🎁 Награды</button>
    <button class="btn sm" id="bTop">🏆 Топ</button>
    <button class="btn sm primary" id="bChat">💬 Чат</button>
    <button class="btn sm" id="bQuest">📅 Задания</button>
    <button class="btn sm primary" id="bTour">🏁 Турнир</button>
    <button class="btn sm" id="bMarket">🛍️ Рынок</button>
    <button class="btn sm" id="bClan">🛡️ Кланы</button>
    <button class="btn sm" id="bBot">🤖 Бой с ботом</button>
    <button class="btn sm" id="bMap">🗺️ Локации</button>
    <button class="btn sm" id="bAgency">🏪 Агентство</button>
    <button class="btn sm" id="bShop">🛒 Снасти</button>
    <button class="btn sm" id="bColl">📒 Альтушки</button>
    <button class="btn sm boss" id="bBoss">👑 Босс</button>
    <button class="btn sm" id="bRec">🏆 Рекорды</button>
    <button class="btn sm" id="bNet">👥 Друзья</button>
    <button class="btn sm" id="bSnd">🔊</button>
  </div>
</div>
<div id="bars">
  <div class="bar" id="barPow"><label>Сила броска</label><div class="tr"><i id="iPow"></i></div></div>
  <div class="bar" id="barTen"><label>Натяжение лески</label><div class="tr"><i id="iTen"></i></div></div>
  <div class="bar" id="barProg"><label>Вытягивание</label><div class="tr"><i id="iProg" style="background:#38bdf8"></i></div></div>
</div>
<div id="cross"></div>
<div id="big">!</div>
<div id="dmg"></div>
<div id="warn">ОТПУСТИ! ЛЕСКА ЛОПНЕТ!</div>
<div id="toast"></div>
<div id="feed"></div>
<div id="hint">Загрузка…</div>
<div id="bossUI">
  <div class="bhp"><label id="lBoss">👑 Луксмаксер-Король</label><div class="tr"><i id="iBoss"></i></div></div>
  <div class="bhp"><label>🧠 Твоя самооценка</label><div class="tr"><i id="iMe"></i></div></div>
  <div class="timing"><div class="z1"></div><div class="z2"></div><i id="mark"></i></div>
  <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn primary" id="bMog">🗿 МОГНУТЬ (пробел)</button><button class="btn" id="bFlee">Сбежать</button></div>
  <div class="pows" id="bossPows"></div>
  <div id="armyInfo" class="nick" style="text-align:center;margin-top:8px"></div>
</div>
<div id="duelUI">
  <div style="display:flex;gap:12px"><div class="bhp" style="flex:1"><label id="dMeL">Ты</label><div class="tr"><i id="dMe" style="background:#4ade80"></i></div></div><div class="bhp" style="flex:1"><label id="dOpL">Соперник</label><div class="tr"><i id="dOp" style="background:#ef4444"></i></div></div></div>
  <div class="timing"><div class="z1"></div><div class="z2"></div><i id="dMark" class="mk"></i></div>
  <div class="pows"><button class="btn primary" id="dMog">🗿 МОГНУТЬ (пробел)</button><button class="btn pw" id="dPow">суперсила (E)</button><button class="btn" id="dLeave">Сдаться</button></div>
  <div id="dInfo" class="nick" style="text-align:center;margin-top:6px"></div>
</div>
<div id="armyUI">
  <div style="display:flex;gap:12px"><div class="bhp" style="flex:1"><label id="aMeL">Твоя армия</label><div class="tr"><i id="aMe" style="background:#4ade80"></i></div></div><div class="bhp" style="flex:1"><label id="aOpL">Армия соперника</label><div class="tr"><i id="aOp" style="background:#ef4444"></i></div></div></div>
  <div class="timing"><div class="z1"></div><div class="z2"></div><i id="aMark" class="mk"></i></div>
  <div class="ord" id="aOrd"></div>
  <div class="pows"><button class="btn primary" id="aMog">🗿 НАТРАВИТЬ (пробел)</button><button class="btn" id="aLeave">Сдаться</button></div>
  <div id="aInfo" class="nick" style="text-align:center;margin-top:6px"></div>
</div>
<div id="tourUI"></div>
<div id="loading">Загружаю Москву и альтушек…</div>
<div id="drop">Отпусти .glb — добавлю модель в толпу</div>
<div class="ov" id="ovCard"><div class="card" id="card"></div></div>
<div class="ov" id="ovColl"><div class="card" id="coll" style="--rc:#c084fc"></div></div>
<div class="ov" id="ovShop"><div class="card" id="shop" style="--rc:#ff3d7f"></div></div>
<div class="ov" id="ovMap"><div class="card" id="map" style="--rc:#38bdf8"></div></div>
<div class="ov" id="ovRec"><div class="card" id="rec" style="--rc:#fbbf24"></div></div>
<div class="ov" id="ovNet"><div class="card" id="net" style="--rc:#4ade80"></div></div>
<div class="ov" id="ovQuest"><div class="card" id="quest" style="--rc:#fbbf24"></div></div>
<div class="ov" id="ovAgency"><div class="card" id="agency" style="--rc:#f472b6"></div></div>
<div class="ov" id="ovBout"><div class="card" id="bout" style="--rc:#c084fc"></div></div>
<div class="ov" id="ovDate"><div class="card" id="date" style="--rc:#f472b6"></div></div>

/* ===== вход / регистрация (работает, когда игра открыта с сервера server.js) ===== */
(function(){
  const KEY='bibinto_fishing_3d_v1',$a=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const tok=()=>{try{return localStorage.getItem('bib_token')}catch(e){return null}};
  async function api(p,o={}){const t=tok();const r=await fetch('api/'+p,{method:o.method||'GET',keepalive:!!o.keepalive,headers:{'Content-Type':'application/json',...(t?{Authorization:'Bearer '+t}:{})},body:o.body!=null?JSON.stringify(o.body):undefined});
    let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw Object.assign(new Error(j.error||('Ошибка '+r.status)),{status:r.status,data:j});return j}
  window.BIB_API=api;
  const show=h=>{$a('#authC').innerHTML=h;$a('#auth').classList.add('show')},hide=()=>$a('#auth').classList.remove('show');
  function form(){return new Promise(res=>{let mode='login';
    const draw=(err)=>{show(`<h2 style="margin:0">🎣 Рыбалка с Бибинто</h2><p class="nick">Онлайн-версия: прогресс хранится в аккаунте, есть топ игроков и кланов и награды за вход.</p>
      <div class="tabs"><button class="btn sm ${mode==='login'?'on':''}" data-m="login">Вход</button><button class="btn sm ${mode==='reg'?'on':''}" data-m="reg">Регистрация</button></div>
      <form class="f" id="aF"><input class="txt" id="aN" maxlength="16" placeholder="Ник (3–16: буквы, цифры, _)" autocomplete="username">
      <input class="txt" id="aP" type="password" maxlength="100" placeholder="Пароль (от 6 символов)" autocomplete="${mode==='reg'?'new-password':'current-password'}">
      ${mode==='reg'?'<input class="txt" id="aP2" type="password" maxlength="100" placeholder="Повтори пароль" autocomplete="new-password">':''}
      <div class="err" id="aE">${esc(err||'')}</div><button class="btn primary" type="submit">${mode==='reg'?'Создать аккаунт':'Войти'}</button></form>
      <div class="actions"><button class="btn sm" id="aG">Играть без аккаунта (прогресс только в этом браузере)</button></div>`);
      document.querySelectorAll('#authC [data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;draw()});
      $a('#aG').onclick=()=>{hide();res('guest')};
      $a('#aF').onsubmit=async e=>{e.preventDefault();const name=$a('#aN').value.trim(),pass=$a('#aP').value;
        if(mode==='reg'&&pass!==$a('#aP2').value){$a('#aE').textContent='Пароли не совпадают';return}
        $a('#aE').textContent='…';try{const r=await api(mode==='reg'?'register':'login',{method:'POST',body:{name,pass}});localStorage.setItem('bib_token',r.token);res(r.user)}catch(err){$a('#aE').textContent=err.message}}};
    draw()})}
  function ask(h,btns){return new Promise(res=>{show(h+`<div class="actions">${btns.map((b,i)=>`<button class="btn ${i?'':'primary'}" data-i="${i}">${b}</button>`).join('')}</div>`);document.querySelectorAll('#authC [data-i]').forEach(b=>b.onclick=()=>{hide();res(+b.dataset.i)})})}
  window.AUTH_READY=(async()=>{
    if(!/^https?:$/.test(location.protocol))return{mode:'local'};
    try{const p=await api('ping');if(!p.ok)return{mode:'local'}}catch(e){return{mode:'local'}}
    let user=null;
    if(tok()){try{user=(await api('me')).user}catch(e){if(e.status===401)localStorage.removeItem('bib_token');else return{mode:'local'}}}
    if(!user){const r=await form();if(r==='guest')return{mode:'guest'};user=r}
    show('<h2>Загружаю сохранение…</h2>');
    const cs=await api('save');let local=null;try{local=JSON.parse(localStorage.getItem(KEY))}catch(e){}
    const owner=localStorage.getItem('bib_owner'),backup=()=>{if(local)localStorage.setItem(KEY+'_backup_'+Date.now(),JSON.stringify(local))};
    if(cs.save){if(!(owner===user.id&&local&&(local.lastSeen||0)>(cs.save.lastSeen||0))){if(owner!==user.id)backup();localStorage.setItem(KEY,JSON.stringify(cs.save))}}
    else if(local&&Array.isArray(local.list)&&owner!==user.id){
      const n=local.list.length,w=Math.round(local.wallet||0).toLocaleString('ru-RU');
      const i=await ask(`<h2>Перенести прогресс?</h2><p>В этом браузере уже есть игра: <b>${n}</b> в коллекции, <b>${w} ₽</b>. Перенести её в аккаунт <b>${esc(user.name)}</b>?</p>`,['Перенести','Начать с нуля']);
      if(i===1){backup();localStorage.removeItem(KEY)}}
    localStorage.setItem('bib_owner',user.id);hide();window.BIB_ONLINE=true;
    return{mode:'online',user,rev:cs.rev||0}
  })().catch(e=>{console.error(e);hide();return{mode:'local'}});
})();
</script>

function gearStat(slot,it){
  if(slot==='rod')return`Натяжение ×${it.t} · дальность ${it.range} м${it.radius?' · радиус +'+it.radius:''}${it.rar?' · редкость +'+it.rar:''}`;
  if(slot==='line')return`Натяжение ×${it.t}`;
  if(slot==='reel')return`Скорость вытягивания ×${it.s}`;
  if(slot==='bait')return it.pack?`Пачка: ${it.pack} забросов`:'Бесконечная';
  if(slot==='amulet')return`Шанс луксмаксера ×${it.lc} · потери ×${it.ll}${it.def?' · защита +'+Math.round(it.def*100)+'%':''}`;
  if(slot==='fit')return`Цена продажи ×${it.sell} · защита от босса +${Math.round(it.def*100)}%`;
}

const AU={ctx:null};
function auInit(){
  if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  const ctx=new C();AU.ctx=ctx;AU.master=ctx.createGain();AU.master.gain.value=save.muted?0:.6;AU.master.connect(ctx.destination);
  const len=ctx.sampleRate*2;
  const wb=ctx.createBuffer(1,len,ctx.sampleRate),wd=wb.getChannelData(0);for(let i=0;i<len;i++)wd[i]=R()*2-1;AU.white=wb;
  const bb=ctx.createBuffer(1,len,ctx.sampleRate),bd=bb.getChannelData(0);let l=0;for(let i=0;i<len;i++){l=(l+.02*(R()*2-1))/1.02;bd[i]=l*3.5}
  const src=ctx.createBufferSource();src.buffer=bb;src.loop=true;const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=420;const g=ctx.createGain();g.gain.value=.22;src.connect(lp).connect(g).connect(AU.master);src.start();AU.amb=g;
}
function tone(f,dur,type='sine',vol=.2,when=0,slide){const c=AU.ctx;if(!c)return;const t=c.currentTime+when,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(AU.master);o.start(t);o.stop(t+dur+.03)}
function noise(dur,vol=.3,freq=1000,type='bandpass',when=0,q=1){const c=AU.ctx;if(!c)return;const t=c.currentTime+when,s=c.createBufferSource();s.buffer=AU.white;const f=c.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f).connect(g).connect(AU.master);s.start(t,R());s.stop(t+dur+.03)}

const NET={peer:null,host:false,conns:[],hostConn:null,players:{},code:null,myId:null,status:'не подключено',tick:null};

const roomId=code=>'bibinto-fish-room-'+code.toLowerCase();
function netStatus(s){NET.status=s;if($('#ovNet').classList.contains('show'))renderNet()}
async function hostRoom(fixed){
  try{await loadPeer()}catch(e){netStatus('ошибка: '+e.message);return}
  netLeave(true);const code=typeof fixed==='string'?fixed:Math.random().toString(36).slice(2,7).toUpperCase();netStatus('создаю комнату…');
  const peer=new Peer(roomId(code));NET.peer=peer;
  peer.on('open',id=>{NET.host=true;NET.code=code;NET.myId=id;NET.players[id]=myProfile();netStatus(code===GLOBAL?'на общем сервере (ты держишь лобби)':'комната создана');startNetTick();feed(code===GLOBAL?'🌍 Ты на общем сервере':`👥 Комната ${code} создана. Скинь код друзьям`);netReady()});
  if(code===GLOBAL)peer.on('error',e=>{if(e.type==='unavailable-id')setTimeout(()=>joinRoom(GLOBAL),400+R()*800)});
  peer.on('connection',c=>{c.on('open',()=>{NET.conns.push(c)});c.on('data',d=>onNet(d,c.peer));c.on('close',()=>{NET.conns=NET.conns.filter(x=>x!==c);const p=NET.players[c.peer];delete NET.players[c.peer];if(p)broadcast({t:'feed',text:`👋 ${p.name} вышел(а)`});broadcastRoom()})});
  peer.on('error',e=>netStatus('ошибка: '+(e.type||e.message)));
}
async function joinRoom(code){
  code=(code||'').trim().toUpperCase();if(!code){toast('Введи код комнаты');return}
  try{await loadPeer()}catch(e){netStatus('ошибка: '+e.message);return}
  netLeave(true);netStatus('подключаюсь…');
  const peer=new Peer();NET.peer=peer;
  peer.on('open',id=>{NET.myId=id;const c=peer.connect(roomId(code),{reliable:true});
    c.on('open',()=>{NET.hostConn=c;NET.code=code;netStatus(code===GLOBAL?'на общем сервере':'в комнате');c.send({t:'state',p:myProfile()});c.send({t:'feed',text:`👋 ${myName()} зашёл(а) ${code===GLOBAL?'на общий сервер':'в комнату'}`});startNetTick();netReady()});
    c.on('data',d=>onNet(d,roomId(code)));c.on('close',()=>{if(NET.peer!==peer)return;const g=code===GLOBAL;toast(g?'Лобби переезжает, переподключаюсь…':'Комната закрыта');netLeave();if(g)setTimeout(()=>{if(!NET.peer)joinRoom(GLOBAL)},600+R()*2500)})});
  peer.on('error',e=>{if(e.type==='peer-unavailable'&&code===GLOBAL){hostRoom(GLOBAL);return}netStatus(e.type==='peer-unavailable'?'комната не найдена':'ошибка: '+(e.type||e.message))});
}
function startNetTick(){clearInterval(NET.tick);NET.tick=setInterval(()=>netSend({t:'state',p:myProfile()}),4000)}
function broadcast(m){NET.conns.forEach(c=>{if(c.open)c.send(m)})}
function broadcastRoom(){if(!NET.host)return;NET.players[NET.myId]=myProfile();broadcast({t:'room',players:NET.players});if($('#ovNet').classList.contains('show'))renderNet()}
function netSend(m){if(NET.host)onNet(m,NET.myId);else if(NET.hostConn&&NET.hostConn.open)NET.hostConn.send(m)}
function onNet(d,from){
  if(!d||typeof d!=='object')return;
  if(netExtra(d,from)||netExtra5(d,from))return;
  if(NET.host){
    if(d.t==='state'&&d.p){NET.players[from]={...sanitizeP(d.p)};broadcastRoom()}
    else if(d.t==='feed'){const text=String(d.text||'').slice(0,160);broadcast({t:'feed',text});feed(text)}
    else if(d.t==='gift'){if(d.to===NET.myId)receiveGift(d);else{const c=NET.conns.find(x=>x.peer===d.to);if(c&&c.open)c.send(d)}}
  }else{
    if(d.t==='room'&&d.players){NET.players={};for(const k in d.players)NET.players[k]=sanitizeP(d.players[k]);if($('#ovNet').classList.contains('show'))renderNet()}
    else if(d.t==='feed')feed(String(d.text||'').slice(0,160));
    else if(d.t==='gift')receiveGift(d);
  }
}

function applyRound(A,la,B,lb){
  const f=s=>1+.12*(s.lvl-1);
  for(const [X,l] of [[A,la],[B,lb]]){if(l.power==='cry')X.hp=Math.min(X.max,X.hp+Math.round(X.max*.3*f(X)));if(l.power==='squad')X.squad=3}
  if(la.power==='toxic')B.poison=3;if(lb.power==='toxic')A.poison=3;
  const out=(X,lx,Y,ly)=>{let m=lx.power==='tarot'?2.2+.1*(X.lvl-1):lx.mult;if(lx.power==='rush')m*=2.2*(1+.08*(X.lvl-1));
    let dmg=X.atk*m*.55,def=Y.def;if(X.squad>0)dmg*=1.4*f(X);if(lx.power==='cringe'){dmg*=1.6*f(X);def=0}
    if(ly.power==='shield')dmg*=Math.max(.1,.3/f(Y));if(ly.power==='screen')dmg*=Math.max(.15,.4/f(Y));return Math.round(dmg*(1-def))};
  const dA=out(A,la,B,lb),dB=out(B,lb,A,la);B.hp-=dA;A.hp-=dB;
  let pA=0,pB=0;if(A.poison>0){pA=Math.round(A.max*.06*f(B));A.hp-=pA;A.poison--}if(B.poison>0){pB=Math.round(B.max*.06*f(A));B.hp-=pB;B.poison--}
  if(A.squad>0)A.squad--;if(B.squad>0)B.squad--;
  return{dA,dB,pA,pB};
}

/* ---------- обмен альтушками между игроками ---------- */
let TRD=null;const TR_K=['trinv','tracc','trdec','trupd','trrdy','trcan'],TR_MAX=20;
const trNew=(id,peer,name,st,out)=>({id,peer,name,st,out,mine:{uids:[],money:0,rev:0},theirs:{girls:[],money:0,rev:0},rm:null,rt:null,t:45});
function tradeInvite(pid){if(TRD){openTrade();return}if(A5||D||TR){toast('Сейчас нельзя: идёт бой или турнир');return}
  const p=NET.players[pid];if(!p){toast('Игрок вышел');return}
  TRD=trNew(uid(),pid,p.name,'wait',true);sendTo(pid,{k:'trinv',id:TRD.id,name:myName()});openTrade()}
const trMine=()=>TRD.mine.uids.map(u=>save.list.find(g=>g.uid===u)).filter(g=>g&&g.kind==='girl');
function trPush(){const T=TRD;T.mine.rev++;T.rm=null;T.rt=null;sendTo(T.peer,{k:'trupd',id:T.id,rev:T.mine.rev,girls:trMine(),money:T.mine.money})}
function trReady(){const T=TRD;if(!T||T.st!=='open')return;if(!T.mine.uids.length&&!T.mine.money&&!T.theirs.girls.length&&!T.theirs.money){toast('Обмен пустой','#fca5a5');return}
  T.rm=[T.mine.rev,T.theirs.rev];sendTo(T.peer,{k:'trrdy',id:T.id,a:T.mine.rev,b:T.theirs.rev});trCheck();openTrade()}
function trCheck(){const T=TRD;if(T&&T.st==='open'&&T.rm&&T.rt&&T.rm[0]===T.mine.rev&&T.rm[1]===T.theirs.rev&&T.rt[0]===T.theirs.rev&&T.rt[1]===T.mine.rev)trExec()}
function trExec(){const T=TRD,mine=trMine();
  if(mine.length!==T.mine.uids.length||save.wallet<T.mine.money){toast('Обмен сорвался: у тебя уже нет части того, что ты предложил','#f87171');sendTo(T.peer,{k:'trcan',id:T.id});closeTrade();return}
  mine.forEach(g=>removeGirl(g.uid));save.wallet+=T.theirs.money-T.mine.money;
  for(const g of T.theirs.girls){g.loc='Обмен';save.list.unshift(g)}
  save.trades=(save.trades||0)+1;persist();sfx('cash');sfx('caught');T.st='done';T.res={gave:mine.map(g=>g.name),got:T.theirs.girls.map(g=>g.name),dm:T.theirs.money-T.mine.money};
  toast(`🔁 Обмен с ${T.name} завершён`,'#4ade80');if(T.out)netFeed(`🔁 ${myName()} и ${T.name} обменялись альтушками`);if(CLOUD.on)cloudSync(true);openTrade()}
function closeTrade(){TRD=null;$('#ovTrade').classList.remove('show')}
function tradeDirect(m,from){const id=String(m.id||'').slice(0,12);
  if(m.k==='trinv'){if(TRD||A5||TR||D){sendTo(from,{k:'trdec',id});return}const p=NET.players[from];TRD=trNew(id,from,p?p.name:String(m.name||'Игрок').slice(0,24),'ask',false);sfx('bite');openTrade();return}
  const T=TRD;if(!T||T.id!==id||T.peer!==from)return;
  if(m.k==='tracc'&&T.st==='wait'){T.st='open';openTrade()}
  else if(m.k==='trdec'||m.k==='trcan'){if(T.st!=='done'){toast(m.k==='trdec'?`${T.name} отказался от обмена`:`${T.name} отменил обмен`,'#fca5a5');closeTrade()}}
  else if(m.k==='trupd'&&T.st==='open'){const gs=(Array.isArray(m.girls)?m.girls:[]).slice(0,TR_MAX).filter(g=>g&&typeof g==='object'&&g.kind==='girl'&&JSON.stringify(g).length<6000).map(g=>initGirl(sanitizeGirl(g)));
    T.theirs={girls:gs,money:Math.round(clamp(+m.money||0,0,1e13)),rev:Math.round(+m.rev||0)};T.rm=null;T.rt=null;openTrade()}
  else if(m.k==='trrdy'&&T.st==='open'){T.rt=[Math.round(+m.a),Math.round(+m.b)];trCheck();if(TRD)openTrade()}}
onDirect=(o=>function(m,from){if(m&&typeof m==='object'&&TR_K.includes(m.k)){tradeDirect(m,from);return}o(m,from)})(onDirect);
function openTrade(){const T=TRD,c=$('#trade');if(!T){closeTrade();return}let h=head(`🔁 Обмен с ${esc(T.name)}`,'bTrX');

{const pt=poseTick;poseTick=function(dt){

/* ---------- ЧАТ: общий, клановый, личные сообщения ---------- */
OVS.push('#ovChat');
const CHAT={mode:ONLINE?'srv':'p2p',seq:0,conv:{},last:{},cur:'g',read:{},ign:{},names:{},admin:false,muted:0,loaded:false,polling:false,lid:0,lastSend:0};
const CH_RK='bib_chat_read_'+CHAT.mode;
try{CHAT.read=JSON.parse(localStorage.getItem(CH_RK))||{};CHAT.ign=JSON.parse(localStorage.getItem('bib_chat_ign'))||{}}catch(e){}
const chSave=()=>{try{localStorage.setItem(CH_RK,JSON.stringify(CHAT.read));localStorage.setItem('bib_chat_ign',JSON.stringify(CHAT.ign))}catch(e){}};
const chLid=()=>Date.now()*100+(CHAT.lid++%100);
const chHM=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
function chFromSrv(m){if(!m||typeof m!=='object')return null;
  if(m.sys==='del'){for(const k in CHAT.conv)CHAT.conv[k]=CHAT.conv[k].filter(x=>x.id!==m.ref);return null}
  if(m.sys==='clear'){CHAT.conv.g=[];return null}
  const me=m.from===ACC.user.id;let key='g';
  if(m.ch==='d'){const other=String(me?m.tn:m.fn);key='d:'+other.toLowerCase();CHAT.names[key]=other}else if(String(m.ch).startsWith('c:'))key='c';
  return{id:m.id,key,fn:String(m.fn||''),fid:m.from,tag:m.tag||'',tc:m.tc||'',text:String(m.text||''),t:m.t||Date.now(),me,sys:m.sys==='info'}}
function chAdd(n,quiet){const L=CHAT.conv[n.key]||(CHAT.conv[n.key]=[]);if(L.some(x=>x.id===n.id))return;
  L.push(n);L.sort((a,b)=>a.id-b.id);if(L.length>300)L.splice(0,L.length-300);CHAT.last[n.key]=Math.max(CHAT.last[n.key]||0,n.t);
  const viewing=shown('#ovChat')&&CHAT.cur===n.key;
  if(quiet&&CHAT.read[n.key]==null&&n.key[0]!=='d'&&n.key[0]!=='p')CHAT.read[n.key]=n.id;
  if(!quiet&&!n.me&&!viewing&&!CHAT.ign[n.fn.toLowerCase()]){if(n.key[0]==='d'||n.key[0]==='p'){toast(`✉️ ${n.fn}: ${n.text.slice(0,70)}`,'#f9a8d4');sfx('bite')}}}
const chUnread=k=>(CHAT.conv[k]||[]).filter(m=>!m.me&&!m.sys&&m.id>(CHAT.read[k]||0)&&!CHAT.ign[m.fn.toLowerCase()]).length;
function chRefresh(){let n=0;for(const k in CHAT.conv)if(k!=='g')n+=chUnread(k);const g=chUnread('g');
  $('#bChat').innerHTML='💬 Чат'+(n?`<span class="cbadge">${n>99?'99+':n}</span>`:g?' •':'');if(shown('#ovChat'))chDraw()}
async function chPoll(){if(CHAT.polling)return;CHAT.polling=true;
  let t0=0;
  while(true){const dt=Date.now()-t0;if(dt<1500)await new Promise(r=>setTimeout(r,1500-dt));t0=Date.now();
    try{const r=await BIB_API('chat?since='+CHAT.seq+(CHAT.loaded?'&wait=1':''));
      if(r.reset){CHAT.seq=0;CHAT.conv={};CHAT.loaded=false;continue}
      CHAT.admin=!!r.admin;CHAT.muted=+r.muted||0;const first=!CHAT.loaded;
      for(const m of r.msgs||[]){const n=chFromSrv(m);if(n)chAdd(n,first)}CHAT.seq=Math.max(CHAT.seq,+r.seq||0);CHAT.loaded=true;chRefresh()}
    catch(e){if(e.status===401){CHAT.polling=false;return}await new Promise(r=>setTimeout(r,5000))}}}
async function chSend(text){text=String(text||'').replace(/\s+/g,' ').trim().slice(0,300);if(!text)return false;const key=CHAT.cur;
  if(CHAT.mode==='srv'){const body={text};if(key==='c')body.ch='c';else if(key[0]==='d')body.to=CHAT.names[key]||key.slice(2);
    try{const r=await BIB_API('chat',{method:'POST',body});if(r.msg){const n=chFromSrv(r.msg);if(n)chAdd(n)}chRefresh();return true}catch(e){toast(e.message,'#fca5a5');return false}}
  if(!netOn()){toast('Сначала подключись к общему серверу (кнопка в чате)','#fca5a5');return false}
  if(Date.now()-CHAT.lastSend<1200){toast('Не так быстро');return false}CHAT.lastSend=Date.now();
  if(key==='g')netSend({t:'chat',text});
  else if(key==='c'){if(!save.clan){toast('Ты не в клане');return false}netSend({t:'chat',text,clan:save.clan.id})}
  else{const pid=key.slice(2);if(!NET.players[pid]){toast('Игрок уже не в сети','#fca5a5');return false}sendTo(pid,{k:'pm',text});chAdd({id:chLid(),key,fn:myName(),fid:NET.myId,text,t:Date.now(),me:true});chRefresh()}
  return true}
function chP2P(m){const n={id:chLid(),key:m.clan?'c':'g',fn:String(m.fn||'?').slice(0,24),fid:String(m.from||''),tag:String(m.tag||'').slice(0,5),tc:colOk(m.tc),text:String(m.text||'').slice(0,300),t:Date.now(),me:m.from===NET.myId};chAdd(n);chRefresh()}
const chRL={};
netExtra5=(o=>function(d,from){if(d.t!=='chat')return o(d,from);
  if(NET.host){const pl=NET.players[from];if(!pl)return true;const text=String(d.text||'').replace(/\s+/g,' ').trim().slice(0,300);if(!text)return true;
    const now=Date.now();if(now-(chRL[from]||0)<1000)return true;chRL[from]=now;
    const clan=d.clan&&pl.clan&&pl.clan.id===String(d.clan)?pl.clan.id:null;
    const m={t:'chat',from,fn:pl.name,tag:pl.clan?pl.clan.tag:'',tc:pl.clan?pl.clan.c:'',clan,text};
    if(clan){for(const c of NET.conns){const p=NET.players[c.peer];if(c.open&&p&&p.clan&&p.clan.id===clan)c.send(m)}if(save.clan&&save.clan.id===clan)chP2P(m)}
    else{broadcast(m);chP2P(m)}}
  else chP2P(d);return true})(netExtra5);
onDirect=(o=>function(m,from){if(m&&typeof m==='object'&&m.k==='pm'){const p=NET.players[from],key='p:'+from;const nm=p?p.name:'Игрок';CHAT.names[key]=nm;
    const text=String(m.text||'').slice(0,300);if(text)chAdd({id:chLid(),key,fn:nm,fid:from,text,t:Date.now(),me:false});chRefresh();return}o(m,from)})(onDirect);
function chatOpenDM(name,pid){name=String(name||'').slice(0,24);if(!name)return;
  const key=CHAT.mode==='srv'?'d:'+name.toLowerCase():'p:'+pid;if(CHAT.mode==='srv'?name===myName():pid===NET.myId)return;

function chTitle(k){return k==='g'?'🌍 Общий':k==='c'?`🛡️ Клан ${save.clan?'['+esc(save.clan.tag)+']':''}`:'✉️ '+esc(CHAT.names[k]||k.slice(2))}
function renderChat(){const c=$('#chat');
  c.innerHTML=head('💬 Чат','bChX')+`<div class="chatw"><div class="chl" id="chL"></div><div class="chm"><div class="chh" id="chH"></div><div class="msgs" id="chM"></div>

function chDraw(){const L=$('#chL'),H=$('#chH'),M=$('#chM');if(!L||!M)return;

    (CHAT.mode==='srv'?`<div style="margin-top:8px"><small class="nick">Новое личное:</small><div style="display:flex;gap:4px;margin-top:3px"><input class="txt" id="chNew" maxlength="16" placeholder="ник" style="width:100%"><button class="btn sm" id="chNewB">✉️</button></div></div>`

  const k=CHAT.cur,isDM=k[0]==='d'||k[0]==='p',who=isDM?String(CHAT.names[k]||k.slice(2)).toLowerCase():'';

  const wasBottom=M.scrollHeight-M.scrollTop-M.clientHeight<60||CHAT.drawnKey!==k;

  M.innerHTML=`<div class="msg sys">${note}${CHAT.muted>0?`<br>⛔ Ты в муте ещё ${Math.ceil(CHAT.muted/6e4)} мин.`:''}${CHAT.admin?'<br>🛡️ Ты модератор: /mute ник минут, /unmute ник, /clear, ✕ — удалить':''}</div>`+
    (msgs.length?msgs.map(m=>m.sys?`<div class="msg sys">${esc(m.fn)}: ${esc(m.text)}</div>`:`<div class="msg ${m.me?'me':''}"><span class="au" data-au="${esc(m.fn)}" data-fid="${esc(m.fid||'')}">${m.tag?`<span class="ctag" style="background:${colOk(m.tc)}">${esc(m.tag)}</span>`:''}${esc(m.fn)}</span><span class="tm">${chHM(m.t)}</span>${CHAT.admin&&CHAT.mode==='srv'?`<span class="x" data-del="${m.id}" title="Удалить">✕</span>`:''}<div>${esc(m.text)}</div></div>`).join(''):'<div class="msg sys">Пока тихо. Напиши первым!</div>');
